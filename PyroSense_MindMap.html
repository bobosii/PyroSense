            tags:['EMA α=0.3','RAWS','10-sample','FilterState']}},
      {id:'d_val', label:'Validation\nMetrics API', color:'#7dc4ff',
        tt:{title:'GET /validation-metrics',
            body:'Sistem doğruluk istatistikleri:\nActivefire → HIGH/EXTREME beklenir\nPrefire → MODERATE/HIGH beklenir\nNormal → LOW beklenir\nSensorFault → score=0 beklenir\nScenario ground truth ile kıyaslama\nFrontend AnalyticsPage\'de görselleştirilir',
            tags:['Ground Truth','Validation','AnalyticsPage']}},
    ]
  },
];

// ── LAYOUT ────────────────────────────────────────────────────────────
function buildNodes() {
  nodes = [];
  nodes.push({...CENTER, x:0, y:0, parent:null, depth:0});
  BRANCHES.forEach(b => {
    const rad = b.angle * Math.PI / 180;
    const bx = Math.cos(rad) * b.dist;
    const by = Math.sin(rad) * b.dist;
    nodes.push({...b, x:bx, y:by, parent:'root', depth:1});
    const ch = b.children || [];
    const n = ch.length;
    ch.forEach((c, i) => {
      const spread = Math.min(75, 340/(BRANCHES.length * 1.4));
      const ba = b.angle - spread*(n-1)/2 + spread*i;
      const cr = (ba * Math.PI/180);
      const cd = 155;
      nodes.push({...c, x:bx+Math.cos(cr)*cd, y:by+Math.sin(cr)*cd,
        r:c.r||33, parent:b.id, depth:2, pc:b.color});
    });
  });
}

// ── DRAW ─────────────────────────────────────────────────────────────
function resize() {
  W = cont.clientWidth; H = cont.clientHeight;
  canvas.width = W; canvas.height = H;
  if (tr.x===0 && tr.y===0) { tr.x=W/2; tr.y=H/2; }
  draw();
}
function w2s(wx,wy) { return {x:wx*tr.s+tr.x, y:wy*tr.s+tr.y}; }
function s2w(sx,sy) { return {x:(sx-tr.x)/tr.s, y:(sy-tr.y)/tr.s}; }

function drawEdge(a,b) {
  const f=w2s(a.x,a.y), t=w2s(b.x,b.y);
  const col = b.pc||b.color||'#888';
  const alpha = b.depth===1?0.5:0.3;
  const lw = b.depth===1?2.2:1.4;
  ctx.save();
  ctx.beginPath();
  const mx=(f.x+t.x)/2, my=(f.y+t.y)/2;
  ctx.moveTo(f.x,f.y);
  ctx.quadraticCurveTo(mx,my,t.x,t.y);
  ctx.strokeStyle = col + Math.round(alpha*255).toString(16).padStart(2,'0');
  ctx.lineWidth = lw * tr.s;
  ctx.stroke();
  ctx.restore();
}

function hex2rgb(h) {
  return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;
}

function drawNode(n) {
  const {x:sx,y:sy}=w2s(n.x,n.y);
  const r=(n.r||38)*tr.s;
  const isH = hov&&hov.id===n.id;
  ctx.save();
  ctx.shadowColor = n.color;
  ctx.shadowBlur = isH?30:12;
  const g=ctx.createRadialGradient(sx-r*.3,sy-r*.3,r*.1,sx,sy,r);
  const rgb=hex2rgb(n.color);
  g.addColorStop(0,`rgba(${rgb},0.92)`);
  g.addColorStop(1,`rgba(${rgb},0.38)`);
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=isH?'#fff':n.color;
  ctx.lineWidth=isH?2.5:1.5;
  ctx.stroke();
  ctx.shadowBlur=0;
  const lines=(n.label||'').split('\n');
  const fs=Math.max(8.5,Math.min(12.5,r*0.27))*(n.bold?1.1:1);
  ctx.font=`${n.bold?'700':'600'} ${fs}px Segoe UI,system-ui`;
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lh=fs*1.3, th=lines.length*lh;
  lines.forEach((l,i)=>ctx.fillText(l,sx,sy-th/2+lh*(i+.5)));
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=1;
  const gs=60, ox=tr.x%(gs*tr.s), oy=tr.y%(gs*tr.s);
  for(let x=ox;x<W;x+=gs*tr.s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy;y<H;y+=gs*tr.s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
  nodes.forEach(n=>{
    if(n.parent){const p=nodes.find(x=>x.id===n.parent);if(p)drawEdge(p,n);}
  });
  nodes.forEach(n=>drawNode(n));
}

// ── INTERACTION ───────────────────────────────────────────────────────
function nodeAt(sx,sy) {
  const {x:wx,y:wy}=s2w(sx,sy);
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    if(Math.hypot(wx-n.x,wy-n.y)<=(n.r||38))return n;
  }
  return null;
}

cont.addEventListener('mousemove',e=>{
  const rc=cont.getBoundingClientRect();
  const sx=e.clientX-rc.left, sy=e.clientY-rc.top;
  if(dragging){tr.x+=e.clientX-lm.x;tr.y+=e.clientY-lm.y;lm={x:e.clientX,y:e.clientY};draw();return;}
  const n=nodeAt(sx,sy); hov=n; cont.style.cursor=n?'pointer':'grab'; draw();
  const tt=document.getElementById('tooltip');
  if(n&&n.tt){
    document.getElementById('tt-t').textContent=n.tt.title;
    document.getElementById('tt-b').textContent=n.tt.body;
    const te=document.getElementById('tt-tags'); te.innerHTML='';
    (n.tt.tags||[]).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;te.appendChild(s);});
    let lx=e.clientX+14, ly=e.clientY-8;
    if(lx+320>window.innerWidth)lx=e.clientX-330;
    if(ly+220>window.innerHeight)ly=e.clientY-220;
    tt.style.left=lx+'px'; tt.style.top=ly+'px'; tt.classList.add('vis');
  } else tt.classList.remove('vis');
});

cont.addEventListener('mousedown',e=>{dragging=true;lm={x:e.clientX,y:e.clientY};cont.style.cursor='grabbing';});
window.addEventListener('mouseup',()=>{dragging=false;cont.style.cursor='grab';});

cont.addEventListener('wheel',e=>{
  e.preventDefault();
  const rc=cont.getBoundingClientRect();
  const sx=e.clientX-rc.left, sy=e.clientY-rc.top;
  const d=e.deltaY<0?1.1:0.91;
  const ns=Math.min(3.5,Math.max(0.2,tr.s*d));
  tr.x=sx-(sx-tr.x)*(ns/tr.s); tr.y=sy-(sy-tr.y)*(ns/tr.s); tr.s=ns; draw();
},{passive:false});

function resetView(){tr={x:W/2,y:H/2,s:1};draw();}
function zoom(f){tr.s=Math.min(3.5,Math.max(0.2,tr.s*f));draw();}

// ── INIT ─────────────────────────────────────────────────────────────
let drag=false;
buildNodes();
window.addEventListener('resize',resize);
resize();

// Giriş animasyonu
const fin=JSON.parse(JSON.stringify(nodes));
let af=0; const tf=50;
function anim(){
  af++;
  const t=Math.min(1,af/tf);
  const e=1-Math.pow(1-t,3);
  nodes.forEach((n,i)=>{n.x=fin[i].x*e;n.y=fin[i].y*e;});
  draw();
  if(af<tf)requestAnimationFrame(anim);
  else nodes.forEach((n,i)=>{n.x=fin[i].x;n.y=fin[i].y;});
}
anim();
</script>
</body>
